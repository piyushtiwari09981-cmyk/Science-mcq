<script>
const data=[{"chapter":"Biology • Life Processes","q":"A cell has a very high demand for ATP because it performs intense aerobic respiration. Which organelle would be especially abundant in such a cell?","opts":["Nucleus","Mitochondria","Ribosome","Golgi apparatus"],"ans":1,"hint":"Think of the organelle where most aerobic cellular respiration occurs.","explanation":"Mitochondria are the main sites of aerobic respiration and ATP production, so they are called the powerhouse of the cell."},{"chapter":"Biology • Life Processes","q":"The process by which green plants prepare food is called:","opts":["Respiration","Transpiration","Photosynthesis","Digestion"],"ans":2,"hint":"Think of the process using sunlight, carbon dioxide and water.","explanation":"Photosynthesis converts carbon dioxide and water into glucose using light energy captured by chlorophyll."},{"chapter":"Biology • Life Processes","q":"Which pigment absorbs sunlight for photosynthesis?","opts":["Haemoglobin","Chlorophyll","Melanin","Keratin"],"ans":1,"hint":"It is the green pigment found in chloroplasts.","explanation":"Chlorophyll absorbs light energy needed for photosynthesis."},{"chapter":"Biology • Life Processes","q":"Which gas is taken in by plants during photosynthesis?","opts":["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],"ans":2,"hint":"It is the carbon source used to make glucose.","explanation":"Plants take in carbon dioxide, which is fixed during photosynthesis to form carbohydrates."},{"chapter":"Biology • Life Processes","q":"A leaf loses water vapour and exchanges gases through microscopic openings whose opening and closing can be regulated. These structures are:","opts":["Stomata","Villi","Nephrons","Alveoli"],"ans":0,"hint":"These pores regulate gas exchange and water loss from leaves.","explanation":"Stomata are tiny openings controlled by guard cells; they allow gas exchange and regulate transpiration."},{"chapter":"Biology • Life Processes","q":"Salivary amylase begins the digestion of:","opts":["Proteins","Fats","Starch","Vitamins"],"ans":2,"hint":"This enzyme acts on a carbohydrate.","explanation":"Salivary amylase begins digestion of starch in the mouth by converting it into simpler sugars."},{"chapter":"Biology • Life Processes","q":"Hydrochloric acid is present in the:","opts":["Mouth","Stomach","Small intestine","Large intestine"],"ans":1,"hint":"Think of the organ where gastric juice is secreted.","explanation":"The stomach secretes hydrochloric acid, creating an acidic medium for pepsin and helping kill microbes."},{"chapter":"Biology • Life Processes","q":"Bile is produced by the:","opts":["Pancreas","Liver","Stomach","Kidney"],"ans":1,"hint":"Bile is made by a large digestive gland.","explanation":"The liver produces bile. It helps emulsify fats and makes their digestion more efficient."},{"chapter":"Biology • Life Processes","q":"A student tracks digested nutrients after a meal and asks where most soluble products finally enter the bloodstream. Which region is primarily responsible?","opts":["Stomach","Small intestine","Large intestine","Oesophagus"],"ans":1,"hint":"Look for the longest part of the alimentary canal with villi.","explanation":"Most digested nutrients are absorbed through the villi of the small intestine."},{"chapter":"Biology • Life Processes","q":"Finger-like projections in the small intestine are called:","opts":["Alveoli","Villi","Nephrons","Cilia"],"ans":1,"hint":"They greatly increase the internal surface area.","explanation":"Villi are finger-like projections lining the small intestine; their large surface area helps efficient absorption."},{"chapter":"Biology • Life Processes","q":"The structural and functional unit of kidney is:","opts":["Neuron","Nephron","Alveolus","Villus"],"ans":1,"hint":"Think of the microscopic filtering unit of the kidney.","explanation":"A nephron is the structural and functional unit of the kidney and performs filtration, reabsorption and secretion."},{"chapter":"Biology • Life Processes","q":"During urine formation, the first major filtration of blood plasma occurs through a capillary network. Identify it.","opts":["Glomerulus","Ureter","Urinary bladder","Urethra"],"ans":0,"hint":"Blood is filtered through a capillary network inside Bowman's capsule.","explanation":"The glomerulus is a tuft of capillaries where ultrafiltration of blood occurs."},{"chapter":"Biology • Life Processes","q":"The main function of red blood cells is to transport:","opts":["Hormones","Oxygen","Digestive enzymes","Urea"],"ans":1,"hint":"Think of haemoglobin's main role.","explanation":"Red blood cells contain haemoglobin, which binds oxygen and transports it from the lungs to tissues."},{"chapter":"Biology • Life Processes","q":"Blood leaving the lungs is oxygen-rich but is carried in a vessel technically called a vein. Which vessel is this?","opts":["Pulmonary artery","Pulmonary vein","Vena cava","Aorta"],"ans":1,"hint":"This is the unusual vein that carries oxygen-rich blood.","explanation":"The pulmonary vein carries oxygenated blood from the lungs to the left atrium."},{"chapter":"Biology • Life Processes","q":"Anaerobic respiration in yeast produces:","opts":["Lactic acid only","Alcohol and carbon dioxide","Oxygen and water","Glucose and oxygen"],"ans":1,"hint":"Yeast performs alcoholic fermentation without oxygen.","explanation":"In yeast, anaerobic respiration produces ethanol and carbon dioxide and releases some energy."},{"chapter":"Biology • Life Processes","q":"The exchange of gases in human lungs takes place in:","opts":["Bronchi","Trachea","Alveoli","Diaphragm"],"ans":2,"hint":"Choose the tiny air sacs surrounded by blood capillaries.","explanation":"Alveoli provide a large, thin, moist surface for diffusion of oxygen and carbon dioxide."},{"chapter":"Biology • Life Processes","q":"Which process releases energy from food inside cells?","opts":["Nutrition","Respiration","Excretion","Transportation"],"ans":1,"hint":"It breaks down food molecules to release usable energy.","explanation":"Respiration is the cellular process that releases energy from food, mainly in the form of ATP."},{"chapter":"Biology • Control & Coordination","q":"The basic structural and functional unit of the nervous system is:","opts":["Neuron","Nephron","Alveolus","Villus"],"ans":0,"hint":"It is the specialized cell that transmits nerve impulses.","explanation":"A neuron is the basic structural and functional unit of the nervous system."},{"chapter":"Biology • Control & Coordination","q":"A nerve impulse reaches the end of one neuron but does not directly cross the tiny gap to the next neuron as a continuous cytoplasmic connection. The gap is called:","opts":["Synapse","Axon","Dendrite","Cell body"],"ans":0,"hint":"Signals cross a tiny junction between neurons.","explanation":"The synapse is the functional junction between neurons across which a signal is transmitted."},{"chapter":"Biology • Control & Coordination","q":"A quick automatic response to a stimulus is called:","opts":["Growth","Reflex action","Digestion","Transpiration"],"ans":1,"hint":"Think of an immediate, involuntary response to a stimulus.","explanation":"A reflex action is a rapid automatic response that helps protect the body from harmful stimuli."},{"chapter":"Biology • Control & Coordination","q":"A person touches a hot object and withdraws the hand before consciously analysing the sensation. Which structure primarily coordinates this rapid response?","opts":["Cerebrum","Spinal cord","Cerebellum","Pituitary gland"],"ans":1,"hint":"The response pathway is organized through the central nervous system at a lower level.","explanation":"Most reflex actions are coordinated through the spinal cord, allowing rapid responses before conscious processing."},{"chapter":"Biology • Control & Coordination","q":"A gymnast needs precise coordination to maintain posture and balance while moving. Which brain region is chiefly involved?","opts":["Cerebrum","Cerebellum","Medulla","Hypothalamus"],"ans":1,"hint":"Think of the brain region that coordinates muscular activity.","explanation":"The cerebellum coordinates voluntary movements and helps maintain balance and posture."},{"chapter":"Biology • Control & Coordination","q":"The largest part of the human brain is:","opts":["Cerebrum","Cerebellum","Medulla","Spinal cord"],"ans":0,"hint":"It is the main region associated with thinking and voluntary actions.","explanation":"The cerebrum is the largest part of the human brain and is involved in conscious activities, thinking and memory."},{"chapter":"Biology • Control & Coordination","q":"The hormone responsible for growth is secreted by the:","opts":["Thyroid","Pituitary","Pancreas","Adrenal"],"ans":1,"hint":"It is the master endocrine gland at the base of the brain.","explanation":"The pituitary gland secretes growth hormone, which promotes growth and development."},{"chapter":"Biology • Control & Coordination","q":"Insulin is secreted by the:","opts":["Thyroid gland","Pancreas","Adrenal gland","Pituitary gland"],"ans":1,"hint":"Think of the endocrine part of the digestive gland.","explanation":"The pancreas secretes insulin, which helps regulate blood glucose concentration."},{"chapter":"Biology • Control & Coordination","q":"Iodine is required for the synthesis of:","opts":["Insulin","Thyroxine","Adrenaline","Auxin"],"ans":1,"hint":"Iodine is needed by the thyroid gland.","explanation":"Iodine is required to synthesize thyroxine, a hormone involved in regulation of metabolism."},{"chapter":"Biology • Control & Coordination","q":"The hormone released during emergency situations is:","opts":["Adrenaline","Insulin","Thyroxine","Auxin"],"ans":0,"hint":"Think of the fight-or-flight response.","explanation":"Adrenaline prepares the body for emergencies by increasing heart rate, breathing rate and blood flow to muscles."},{"chapter":"Biology • Control & Coordination","q":"Growth of a plant shoot towards light is called:","opts":["Geotropism","Phototropism","Hydrotropism","Chemotropism"],"ans":1,"hint":"The stimulus is light.","explanation":"Phototropism is directional growth in response to light; shoots generally show positive phototropism."},{"chapter":"Biology • Control & Coordination","q":"Auxin mainly promotes:","opts":["Shoot growth","Blood clotting","Digestion","Breathing"],"ans":0,"hint":"Auxin is a plant growth regulator strongly linked with shoot elongation.","explanation":"Auxin promotes cell elongation and is important in shoot growth and tropic responses."},{"chapter":"Biology • Control & Coordination","q":"The bending of roots towards gravity is:","opts":["Positive geotropism","Negative geotropism","Phototropism","Hydrotropism"],"ans":0,"hint":"Roots grow in the direction of gravity.","explanation":"Roots show positive geotropism because their growth is directed toward gravity."},{"chapter":"Biology • Control & Coordination","q":"Which plant hormone promotes cell division?","opts":["Cytokinin","Auxin","Abscisic acid","Ethylene"],"ans":0,"hint":"Its name is associated with cytokinesis/cell division.","explanation":"Cytokinins promote cell division and also help delay ageing in plant tissues."},{"chapter":"Biology • Control & Coordination","q":"Which hormone generally inhibits plant growth and promotes dormancy?","opts":["Auxin","Gibberellin","Abscisic acid","Cytokinin"],"ans":2,"hint":"Think of the stress hormone associated with dormancy.","explanation":"Abscisic acid generally inhibits growth and promotes dormancy, especially under stressful conditions."},{"chapter":"Biology • Control & Coordination","q":"The coordination of voluntary actions is mainly associated with the:","opts":["Cerebrum","Medulla","Spinal cord","Cerebellum"],"ans":0,"hint":"Think of the higher brain centre responsible for conscious control.","explanation":"The cerebrum is involved in conscious thought and voluntary actions."},{"chapter":"Chemistry • Chemical Reactions","q":"A reaction is represented with unequal numbers of atoms on the two sides. Why must coefficients be adjusted before the equation is accepted as a balanced equation?","opts":["Conservation of mass","Constant volume","Conservation of energy only","Multiple proportions"],"ans":0,"hint":"Which law says matter is neither created nor destroyed in a chemical reaction?","explanation":"Chemical equations are balanced according to the law of conservation of mass: the number of atoms of each element must be equal on both sides."},{"chapter":"Chemistry • Chemical Reactions","q":"2Mg + O₂ → 2MgO is a:","opts":["Decomposition reaction","Combination reaction","Displacement reaction","Double displacement reaction"],"ans":1,"hint":"Two reactants form one product.","explanation":"A combination reaction occurs when two or more substances combine to form a single product. Magnesium and oxygen form magnesium oxide."},{"chapter":"Chemistry • Chemical Reactions","q":"CaCO₃ → CaO + CO₂ is a:","opts":["Combination","Decomposition","Displacement","Neutralisation"],"ans":1,"hint":"One compound breaks into simpler substances.","explanation":"This is decomposition because one compound, calcium carbonate, breaks into calcium oxide and carbon dioxide on heating."},{"chapter":"Chemistry • Chemical Reactions","q":"A reaction in which one element displaces another from a compound is:","opts":["Combination","Displacement","Decomposition","Precipitation"],"ans":1,"hint":"One element takes the place of another element in a compound.","explanation":"In a displacement reaction, a more reactive element displaces a less reactive element from its compound."},{"chapter":"Chemistry • Chemical Reactions","q":"Two colourless solutions are mixed and an insoluble white solid immediately appears. In AgNO₃ + NaCl → ?, which product is the precipitate?","opts":["Combination reaction","Double displacement reaction","Decomposition reaction","Redox-free reaction"],"ans":1,"hint":"Exchange of ions between two compounds occurs.","explanation":"The ions exchange partners, producing insoluble AgCl and NaNO3, so it is a double displacement reaction."},{"chapter":"Chemistry • Chemical Reactions","q":"The white precipitate formed in AgNO₃ + NaCl reaction is:","opts":["AgCl","NaNO₃","AgNO₃","NaCl"],"ans":0,"hint":"Exchange of ions between two compounds occurs.","explanation":"The ions exchange partners, producing insoluble AgCl and NaNO3, so it is a double displacement reaction."},{"chapter":"Chemistry • Chemical Reactions","q":"Oxidation involves:","opts":["Gain of oxygen","Loss of oxygen","Only gain of hydrogen","No change"],"ans":0,"hint":"Use the oxygen-based definition taught in Class 10.","explanation":"Oxidation can be described as gain of oxygen, loss of hydrogen, or loss of electrons."},{"chapter":"Chemistry • Chemical Reactions","q":"Reduction involves:","opts":["Gain of oxygen","Loss of oxygen","Gain of hydrogen","Only loss of electrons"],"ans":2,"hint":"Use the complementary oxygen/hydrogen definition.","explanation":"Reduction can involve loss of oxygen or gain of hydrogen. In this question, gain of hydrogen is the listed correct choice."},{"chapter":"Chemistry • Chemical Reactions","q":"A packet of oily food is flushed with a gas before sealing. The purpose is to reduce contact with oxygen. Which gas is commonly used?","opts":["Oxidising agent","Reducing agent","Catalyst","Solvent"],"ans":1,"hint":"The substance causing another substance to be reduced is called the reducing agent.","explanation":"A reducing agent donates electrons or removes oxygen from another substance and is itself oxidised."},{"chapter":"Chemistry • Chemical Reactions","q":"Rancidity is mainly caused by:","opts":["Reduction of fats","Oxidation of fats and oils","Hydrolysis of water","Neutralisation"],"ans":1,"hint":"Think about what oxygen does to fats and oils over time.","explanation":"Rancidity results mainly from oxidation of fats and oils, producing unpleasant smell and taste."},{"chapter":"Chemistry • Chemical Reactions","q":"A metal powder develops a black coating on strong heating in air. If the metal is copper, which compound is responsible?","opts":["Oxygen","Nitrogen","Hydrogen","Carbon dioxide"],"ans":1,"hint":"Choose an inert gas that reduces contact with oxygen.","explanation":"Nitrogen is filled into snack packets to reduce oxygen exposure and slow oxidation of fats and oils."},{"chapter":"Chemistry • Chemical Reactions","q":"Respiration is generally a:","opts":["Endothermic reaction","Exothermic reaction","Decomposition only","Photochemical reaction"],"ans":1,"hint":"Cellular respiration releases energy overall.","explanation":"Respiration is generally exothermic because oxidation of food releases energy."},{"chapter":"Chemistry • Chemical Reactions","q":"A reaction in which heat is absorbed is called:","opts":["Exothermic","Endothermic","Displacement","Redox"],"ans":1,"hint":"The opposite of heat-releasing reactions.","explanation":"An endothermic reaction absorbs heat from the surroundings."},{"chapter":"Chemistry • Chemical Reactions","q":"When copper powder is heated in air, it forms:","opts":["Copper sulphate","Copper oxide","Copper chloride","Copper carbonate"],"ans":1,"hint":"Copper reacts with oxygen on heating.","explanation":"Copper combines with oxygen to form copper(II) oxide, CuO."},{"chapter":"Chemistry • Chemical Reactions","q":"The black coating formed on copper when heated in air is:","opts":["CuO","Cu₂O","CuCO₃","CuSO₄"],"ans":0,"hint":"The product is the black copper oxide formed on heating.","explanation":"Copper(II) oxide, CuO, is black and forms when copper is heated in air."},{"chapter":"Chemistry • Chemical Reactions","q":"Corrosion of iron is commonly called:","opts":["Rancidity","Rusting","Galvanisation","Alloying"],"ans":1,"hint":"What common name is given to the hydrated iron(III) oxide layer?","explanation":"The corrosion of iron is called rusting and produces rust, a hydrated form of iron(III) oxide."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"A solution changes blue litmus to red and has pH 3. Which description is consistent with both observations?","opts":["Blue","Red","Green","Yellow"],"ans":1,"hint":"Acids change blue litmus to the characteristic acid colour.","explanation":"An acid turns blue litmus red."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"A base turns red litmus:","opts":["Blue","Red","Yellow","Orange"],"ans":0,"hint":"Bases change red litmus to the characteristic base colour.","explanation":"A base turns red litmus blue."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"The pH of a neutral solution at 25°C is:","opts":["0","5","7","14"],"ans":2,"hint":"At 25°C, neutral water is the midpoint of the usual 0–14 pH scale.","explanation":"At 25°C, a neutral solution has pH 7."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"A solution with pH 3 is:","opts":["Strongly acidic","Neutral","Basic","Always salty"],"ans":0,"hint":"Values below 7 are acidic; the farther below 7, the stronger the acidity.","explanation":"A solution with pH 3 is acidic. On the pH scale, lower pH means greater hydrogen-ion concentration."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"A hydrated salt loses water of crystallisation and is used for making casts. Which formula represents Plaster of Paris?","opts":["Sulphuric acid","Hydrochloric acid","Nitric acid","Acetic acid"],"ans":1,"hint":"It is the acid secreted by gastric glands.","explanation":"Hydrochloric acid is present in gastric juice and provides an acidic medium for digestion."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"Baking soda is:","opts":["NaCl","NaHCO₃","Na₂CO₃","CaCO₃"],"ans":1,"hint":"It is sodium hydrogen carbonate.","explanation":"Baking soda is sodium hydrogen carbonate, NaHCO3."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"Washing soda is:","opts":["Na₂CO₃·10H₂O","NaHCO₃","NaCl","CaSO₄"],"ans":0,"hint":"It is hydrated sodium carbonate.","explanation":"Washing soda is sodium carbonate decahydrate, Na2CO3·10H2O."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"Bleaching powder is commonly represented as:","opts":["CaOCl₂","CaCO₃","NaCl","CaSO₄"],"ans":0,"hint":"Recall the standard Class 10 formula used for bleaching powder.","explanation":"Bleaching powder is commonly represented as CaOCl2 in Class 10 chemistry."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"An indicator is colourless in acidic solution but turns pink after excess base is added. Which indicator is being used?","opts":["CaSO₄·2H₂O","CaSO₄·½H₂O","Na₂CO₃·10H₂O","CaCO₃"],"ans":1,"hint":"It is the partially dehydrated form of gypsum.","explanation":"Plaster of Paris is calcium sulphate hemihydrate, CaSO4·1/2H2O."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"Common salt is chemically:","opts":["NaOH","NaCl","Na₂CO₃","HCl"],"ans":1,"hint":"It is the familiar ionic salt of sodium and chloride ions.","explanation":"Common salt is sodium chloride, NaCl."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"The reaction between an acid and a base is called:","opts":["Oxidation","Neutralisation","Decomposition","Displacement"],"ans":1,"hint":"Acid + base generally gives salt and water.","explanation":"A neutralisation reaction occurs when an acid reacts with a base to form salt and water."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"A metal is soft, highly reactive and reacts dangerously with water, so it is kept under kerosene. Which metal fits this description?","opts":["Litmus","Phenolphthalein","Methyl orange","Turmeric"],"ans":0,"hint":"It is a natural indicator traditionally extracted from lichens.","explanation":"Litmus is a natural indicator obtained from lichens."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"A solid ionic compound does not conduct electricity, but its molten form does. What best explains this observation?","opts":["Acidic solution","Basic solution","Neutral solution","Salt only"],"ans":1,"hint":"This indicator is colourless in acid and pink in base.","explanation":"Phenolphthalein turns pink in a basic solution."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"Tooth decay begins when the pH of mouth falls below about:","opts":["9.5","7.0","5.5","2.0"],"ans":2,"hint":"Tooth enamel begins to be attacked below a mildly acidic pH.","explanation":"Tooth decay becomes significant when the mouth pH falls below about 5.5, allowing acids to damage enamel."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"An alloy is made mainly by combining copper with zinc. Which common alloy is obtained?","opts":["Oxygen","Stomach acid","Water","Salt"],"ans":1,"hint":"An antacid neutralizes the excess acid responsible for indigestion.","explanation":"Antacids are mild bases used to neutralize excess hydrochloric acid in the stomach."},{"chapter":"Chemistry • Acids, Bases & Salts","q":"Acid + metal generally produces salt and:","opts":["Oxygen","Hydrogen","Nitrogen","Chlorine"],"ans":1,"hint":"Think of the gas released when a typical reactive metal reacts with dilute acid.","explanation":"Many acids react with metals to form a salt and release hydrogen gas."},{"chapter":"Chemistry • Metals & Non-metals","q":"Which metal is liquid at room temperature?","opts":["Iron","Mercury","Copper","Aluminium"],"ans":1,"hint":"It is the familiar liquid metal used in older thermometers.","explanation":"Mercury is a metal that is liquid at room temperature."},{"chapter":"Chemistry • Metals & Non-metals","q":"Which non-metal is lustrous?","opts":["Sulphur","Iodine","Oxygen","Nitrogen"],"ans":1,"hint":"One common non-metal exception to the usual dull appearance is shiny.","explanation":"Iodine is a lustrous non-metal."},{"chapter":"Chemistry • Metals & Non-metals","q":"A highly reactive metal cannot be extracted by heating its oxide with carbon. Which industrial method is generally required?","opts":["Ductility","Malleability","Sonority","Brittleness"],"ans":1,"hint":"Think of how aluminium can be rolled into thin sheets.","explanation":"Malleability is the ability of a metal to be beaten or rolled into sheets."},{"chapter":"Chemistry • Metals & Non-metals","q":"The property of metals of being drawn into wires is:","opts":["Malleability","Ductility","Sonority","Hardness"],"ans":1,"hint":"Think of copper being made into electrical wires.","explanation":"Ductility is the ability of a metal to be drawn into wires."},{"chapter":"Chemistry • Metals & Non-metals","q":"Which metal is the most reactive among these?","opts":["Gold","Silver","Potassium","Copper"],"ans":2,"hint":"Among the options, identify the metal highest in the reactivity series.","explanation":"Potassium is above the other listed metals in the reactivity series and is therefore the most reactive here."},{"chapter":"Chemistry • Metals & Non-metals","q":"Which metal is extracted from bauxite?","opts":["Iron","Aluminium","Copper","Zinc"],"ans":1,"hint":"Bauxite is the chief ore of a lightweight metal.","explanation":"Aluminium is extracted from bauxite, which is its chief ore."},{"chapter":"Chemistry • Metals & Non-metals","q":"A driver needs a mirror that gives an erect, diminished image and a wider field of view. Which mirror is appropriate?","opts":["Copper","Sodium","Iron","Silver"],"ans":1,"hint":"Think of a very reactive alkali metal that reacts vigorously with air and water.","explanation":"Sodium is stored under kerosene to prevent contact with air and moisture."},{"chapter":"Chemistry • Metals & Non-metals","q":"Ionic compounds generally have:","opts":["Low melting points","High melting points","No ions","Only covalent bonds"],"ans":1,"hint":"Strong electrostatic attraction between ions requires substantial energy to overcome.","explanation":"Ionic compounds generally have high melting points because of strong electrostatic forces between oppositely charged ions."},{"chapter":"Chemistry • Metals & Non-metals","q":"Light enters glass from air and its speed decreases. Relative to the normal, how does the ray generally bend?","opts":["Solid state only","Molten or aqueous state","Neither state","Vacuum"],"ans":1,"hint":"Ions must be free to move for electrical conduction.","explanation":"Ionic compounds conduct electricity when molten or dissolved in water because their ions are mobile."},{"chapter":"Chemistry • Metals & Non-metals","q":"The process of coating iron with zinc is called:","opts":["Alloying","Galvanisation","Roasting","Calcination"],"ans":1,"hint":"The zinc layer protects iron from contact with air and moisture.","explanation":"Galvanisation is the process of coating iron or steel with zinc to prevent corrosion."},{"chapter":"Chemistry • Metals & Non-metals","q":"A lens has positive optical power and brings parallel rays toward a focus. What type of lens is it?","opts":["Bronze","Brass","Steel","Solder"],"ans":1,"hint":"This alloy is commonly used for brass instruments and fittings.","explanation":"Brass is an alloy of copper and zinc."},{"chapter":"Chemistry • Metals & Non-metals","q":"Using the Cartesian sign convention for a thin lens, which relation correctly connects focal length, image distance and object distance?","opts":["Brass","Bronze","Steel","Stainless steel"],"ans":1,"hint":"This traditional alloy is associated with bronze objects.","explanation":"Bronze is an alloy of copper and tin."},{"chapter":"Chemistry • Metals & Non-metals","q":"Which metal is found in liquid state and is used in thermometers?","opts":["Mercury","Sodium","Zinc","Aluminium"],"ans":0,"hint":"The metal is liquid at room temperature.","explanation":"Mercury is liquid at room temperature and was widely used in thermometers because it expands fairly uniformly with temperature."},{"chapter":"Chemistry • Metals & Non-metals","q":"The chief ore of mercury is:","opts":["Cinnabar","Bauxite","Haematite","Calamine"],"ans":0,"hint":"It is a sulphide mineral of mercury.","explanation":"Cinnabar (HgS) is the chief ore of mercury."},{"chapter":"Chemistry • Metals & Non-metals","q":"Highly reactive metals are generally extracted by:","opts":["Electrolysis","Simple heating","Hand picking","Filtration"],"ans":0,"hint":"Very reactive metals cannot be reduced easily by carbon.","explanation":"Highly reactive metals are generally extracted by electrolysis of their molten compounds."},{"chapter":"Chemistry • Metals & Non-metals","q":"A student has difficulty seeing distant objects clearly because the image tends to form in front of the retina. Which corrective lens is needed?","opts":["Al₂O₃","AlCl₃","Al₂S₃","Al(OH)₂"],"ans":0,"hint":"Aluminium has valency 3 and oxygen has valency 2.","explanation":"Combining Al3+ and O2− in the simplest whole-number ratio gives Al2O3."},{"chapter":"Chemistry • Metals & Non-metals","q":"A student can see distant objects clearly but has difficulty seeing nearby objects because the image tends to form behind the retina. Which lens corrects it?","opts":["1:1","3:1","1:3","2:1"],"ans":1,"hint":"The larger part of the mixture is hydrochloric acid.","explanation":"Aqua regia is a mixture of concentrated HCl and HNO3 in a 3:1 ratio by volume."},{"chapter":"Physics • Light","q":"The angle of incidence is equal to the angle of:","opts":["Refraction","Reflection","Deviation","Dispersion"],"ans":1,"hint":"Use the law of reflection.","explanation":"The law of reflection states that the angle of incidence equals the angle of reflection, measured from the normal."},{"chapter":"Physics • Light","q":"The image formed by a plane mirror is:","opts":["Real and inverted","Virtual and erect","Real and erect","Virtual and inverted"],"ans":1,"hint":"A plane mirror does not make the rays actually meet behind it.","explanation":"A plane mirror forms a virtual, erect image of the same size as the object."},{"chapter":"Physics • Light","q":"White light passes through a prism and separates into colours because different wavelengths undergo different amounts of refraction. What is this phenomenon called?","opts":["f = R","f = 2R","f = R/2","f = R²"],"ans":2,"hint":"For a spherical mirror, the principal focus lies halfway between the pole and centre of curvature.","explanation":"The relation is f = R/2, so focal length is half the radius of curvature."},{"chapter":"Physics • Light","q":"The atmosphere makes the daytime sky appear blue. Which explanation best accounts for this observation?","opts":["Only virtual image","Only real image","Real as well as virtual image","No image"],"ans":2,"hint":"Its image nature changes with object position relative to the focus.","explanation":"A concave mirror can form real images for many object positions and a virtual, erect, magnified image when the object is between the pole and focus."},{"chapter":"Physics • Light","q":"The mirror used as a rear-view mirror in vehicles is generally:","opts":["Plane","Concave","Convex","Cylindrical"],"ans":2,"hint":"Drivers need a wide field of view and an erect diminished image.","explanation":"A convex mirror provides a wider field of view and forms a virtual, erect, diminished image, making it suitable for rear-view mirrors."},{"chapter":"Physics • Light","q":"The refractive index of a medium is the ratio of:","opts":["Speed of light in medium to vacuum","Speed of light in vacuum to speed in medium","Wavelength to frequency","Mass to volume"],"ans":1,"hint":"Refractive index compares the speed of light in vacuum with its speed in the medium.","explanation":"The refractive index n is c/v, where c is the speed of light in vacuum and v is its speed in the medium."},{"chapter":"Physics • Light","q":"When light travels from air into glass, it generally bends:","opts":["Away from normal","Towards normal","Along the surface","Backwards"],"ans":1,"hint":"Light enters an optically denser medium.","explanation":"On entering glass from air, light generally slows down and bends towards the normal."},{"chapter":"Physics • Light","q":"The SI unit of power of a lens is:","opts":["Metre","Dioptre","Newton","Joule"],"ans":1,"hint":"Lens power is the reciprocal of focal length in metres.","explanation":"The SI unit of lens power is the dioptre (D)."},{"chapter":"Physics • Light","q":"A convex lens is also called a:","opts":["Diverging lens","Converging lens","Plane lens","Reflecting lens"],"ans":1,"hint":"Parallel rays are brought together by this lens.","explanation":"A convex lens is converging because it bends parallel rays toward the principal axis and can bring them to a focus."},{"chapter":"Physics • Light","q":"The lens formula is:","opts":["1/f = 1/v − 1/u","1/f = 1/v + 1/u","f = u + v","P = 1/R"],"ans":0,"hint":"Use the Cartesian sign convention used for Class 10 lenses.","explanation":"With the standard Cartesian sign convention, the lens formula is 1/f = 1/v − 1/u."},{"chapter":"Physics • Human Eye","q":"The part of the eye that controls the amount of light entering is:","opts":["Retina","Iris","Cornea","Optic nerve"],"ans":1,"hint":"It changes the size of the pupil.","explanation":"The iris controls the amount of light entering the eye by adjusting the pupil size."},{"chapter":"Physics • Human Eye","q":"The image is formed on the:","opts":["Iris","Retina","Pupil","Cornea"],"ans":1,"hint":"The light-sensitive layer contains rods and cones.","explanation":"The retina is the light-sensitive screen of the eye where the image is formed."},{"chapter":"Physics • Human Eye","q":"The ability of the eye lens to change its focal length is called:","opts":["Accommodation","Dispersion","Reflection","Scattering"],"ans":0,"hint":"For a spherical mirror, the principal focus lies halfway between the pole and centre of curvature.","explanation":"The relation is f = R/2, so focal length is half the radius of curvature."},{"chapter":"Physics • Human Eye","q":"Myopia is corrected using a:","opts":["Convex lens","Concave lens","Plane mirror","Cylindrical mirror"],"ans":1,"hint":"A myopic eye focuses distant objects in front of the retina.","explanation":"Myopia is corrected with a concave lens, which diverges incoming rays so the eye can focus them on the retina."},{"chapter":"Physics • Human Eye","q":"Hypermetropia is corrected using a:","opts":["Concave lens","Convex lens","Plane lens","Prism only"],"ans":1,"hint":"A hypermetropic eye tends to focus near objects behind the retina.","explanation":"Hypermetropia is corrected using a convex lens, which converges the rays before they enter the eye."},{"chapter":"Physics • Human Eye","q":"Presbyopia is mainly associated with:","opts":["Ageing of the eye","Only colour blindness","Damage to eardrum","Night blindness only"],"ans":0,"hint":"It is a common age-related focusing problem.","explanation":"Presbyopia is associated with ageing and reduced accommodation, often making nearby objects difficult to focus on."},{"chapter":"Physics • Human Eye","q":"The splitting of white light into its constituent colours is called:","opts":["Reflection","Dispersion","Refraction only","Diffusion"],"ans":1,"hint":"Different colours refract by different amounts in a prism.","explanation":"Dispersion is the splitting of white light into its constituent colours because different wavelengths refract by different amounts."},{"chapter":"Physics • Human Eye","q":"The blue colour of the sky is mainly due to:","opts":["Reflection","Scattering of light","Dispersion by clouds","Total internal reflection"],"ans":1,"hint":"Shorter wavelengths are scattered more strongly by the atmosphere.","explanation":"The sky appears blue mainly because air molecules scatter shorter-wavelength visible light more strongly than longer-wavelength light."},{"chapter":"Chemistry • Chemical Reactions","q":"Statement I: A substance that is oxidised acts as a reducing agent. Statement II: A reducing agent itself undergoes oxidation. Which option is correct?","opts":["Both I and II are correct","I is correct but II is incorrect","I is incorrect but II is correct","Both I and II are incorrect"],"ans":0,"hint":"Remember the agent causes reduction in another substance but itself gets oxidised.","explanation":"A reducing agent donates electrons or removes oxygen from another substance and is itself oxidised, so both statements are correct."},{"chapter":"Physics • Light","q":"A spherical mirror has radius of curvature 40 cm. Using the standard mirror relation, what is its focal length in magnitude?","opts":["10 cm","20 cm","40 cm","80 cm"],"ans":1,"hint":"For a spherical mirror, the principal focus lies halfway between the pole and centre of curvature.","explanation":"The focal length is f = R/2. Therefore f = 40/2 = 20 cm."},{"chapter":"Physics • Human Eye","q":"A student can see distant objects clearly but cannot focus comfortably on nearby objects due to reduced accommodation with age. Which defect is most directly described?","opts":["Myopia","Hypermetropia","Presbyopia","Colour blindness"],"ans":2,"hint":"Look for the age-related reduction in the eye's accommodation.","explanation":"Presbyopia is associated with ageing and reduced accommodation, making near vision difficult."}];
let i=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function load(){
 answered=false;
 $("counter").textContent=`Question ${i+1}/${data.length}`;
 $("bar").style.width=(i/data.length*100)+"%";
 $("chapter").textContent=data[i].chapter;
 $("question").textContent=(i+1)+". "+data[i].q;
 $("hint").style.display="none"; $("explain").style.display="none";
 $("hintBtn").style.display="inline-block"; $("nextBtn").style.display="none";
 const box=$("options"); box.innerHTML="";
 data[i].opts.forEach((o,k)=>{
   const b=document.createElement("button");
   b.type="button"; b.className="opt"; b.dataset.k=k;
   b.textContent=String.fromCharCode(65+k)+") "+o;
   box.appendChild(b);
 });
 window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
 const b=e.target.closest(".opt");
 if(b){
   if(answered)return;
   answered=true;
   const k=Number(b.dataset.k),x=data[i],buttons=[...document.querySelectorAll(".opt")];
   buttons.forEach(z=>z.disabled=true);
   if(k===x.ans){score++;b.classList.add("correct");$("explain").textContent="✅ Correct! "+x.explanation}
   else{b.classList.add("wrong");buttons[x.ans].classList.add("correct");$("explain").textContent="❌ Wrong! Correct answer: "+String.fromCharCode(65+x.ans)+") "+x.opts[x.ans]+". "+x.explanation}
   $("explain").style.display="block";$("hintBtn").style.display="none";$("nextBtn").style.display="inline-block";
 }
});
$("hintBtn").addEventListener("click",()=>{$("hint").textContent="💡 Hint: "+data[i].hint;$("hint").style.display="block"});
$("nextBtn").addEventListener("click",()=>{
 if(i<data.length-1){i++;load()}
 else{$("quiz").style.display="none";$("result").style.display="block";$("bar").style.width="100%";$("score").textContent=score+" / "+data.length;$("message").textContent=score>=85?"🔥 Excellent board-level performance!":score>=70?"💪 Strong attempt!":score>=50?"👍 Keep practising tricky concepts!":"📚 Revise concepts and try again!"}
});
$("restartBtn").addEventListener("click",()=>{i=0;score=0;$("result").style.display="none";$("quiz").style.display="block";load()});
load();
</script>
</body></html>
